<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buku Cerita Rakyat Indonesia</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="header">

        <div class="header-left">
            <h1>📖 Buku Cerita Rakyat Indonesia</h1>
            <p id="pageCounter">Halaman 1 dari 10</p>
        </div>

        <button id="musicButton" class="music-button" onclick="toggleMusic()">
            🎵 Musik OFF
        </button>

    </header>


    <!-- ================= AUDIO MUSIK ================= -->

    <audio id="backgroundMusic" loop preload="auto">
        <source src="audio/musik-dongeng.mp3" type="audio/mpeg">
        Browser kamu tidak mendukung audio.
    </audio>


    <!-- ================= CONTAINER ================= -->

    <main class="container">

        <div class="story-card">

            <!-- GAMBAR -->
            <div class="image-container">
                <img id="storyImage" src="" alt="Gambar cerita">
            </div>


            <!-- JUDUL -->
            <h2 id="storyTitle"></h2>


            <!-- CERITA -->
            <p id="storyDescription"></p>


            <!-- ================= SUARA ================= -->

            <div class="voice-section">

                <h3>🔊 Dengarkan Cerita</h3>

                <div class="voice-buttons">

                    <button class="voice-btn play" onclick="speakStory()">
                        ▶️ Putar
                    </button>

                    <button class="voice-btn pause" onclick="pauseStory()">
                        ⏸️ Jeda
                    </button>

                    <button class="voice-btn resume" onclick="resumeStory()">
                        ▶️ Lanjut
                    </button>

                    <button class="voice-btn stop" onclick="stopStory()">
                        ⏹️ Berhenti
                    </button>

                </div>

            </div>


            <!-- ================= NAVIGASI ================= -->

            <div class="navigation">

                <button class="nav-btn previous" onclick="previousStory()">
                    ◀ Sebelumnya
                </button>

                <button class="nav-btn home" onclick="backToStart()">
                    🏠 Awal
                </button>

                <button class="nav-btn next" onclick="nextStory()">
                    Berikutnya ▶
                </button>

            </div>


            <!-- ================= PESAN MORAL ================= -->

            <div class="moral-box">

                <h3>💡 Pesan Moral</h3>

                <p id="moralText"></p>

            </div>


            <!-- ================= TITIK HALAMAN ================= -->

            <div id="dots" class="dots"></div>

        </div>

    </main>


    <script src="js/app.js"></script>

</body>
</html>
